services:
  eqs:
    image: eqs:latest
    build: .
    container_name: eqs
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      EQS_ADMIN_PASSWORD: ${EQS_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
