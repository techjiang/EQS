# EQS Nginx 反向代理示例
server {
    listen 80;
    server_name eqs.example.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr 而不是 $proxy_add_x_forwarded_for：
        # 后者会把访客自己带的 X-Forwarded-For 原样保留并追加，最左段谁都能伪造。
        # 只写真实对端，EQS 侧再开「信任代理头 1 层」就能拿到准确 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # 让 AI 流式响应实时透传
        proxy_read_timeout 300s;
    }
}

# ⚠️ 部署后必做的一步：
#   系统设置 → 站点 → 「客户端 IP 来源」改成「信任代理头」，代理层数填 1。
#   EQS 默认不信任 X-Forwarded-For（它是客户端自己发的头，信了就等于让
#   「每个 IP 限填一次」和「登录失败锁号」失效）。但在本配置下，不打开这一项时
#   所有访客对端都是 127.0.0.1 —— 结果是全站只能填一次、一个人输错密码全站被锁。
